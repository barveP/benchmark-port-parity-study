[project]
name = "benchmark-port-parity"
version = "0.1.0"
description = "How much does a parity experiment prove? A statistical look at benchmarks ported to Harbor."
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14", "matplotlib>=3.9", "pytest>=8", "pypdf>=5", "markdown>=3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
