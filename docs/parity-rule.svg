<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold">A parity experiment, and the rule that decides it</text>

  <!-- left: what a parity experiment is -->
  <rect x="20" y="70" width="290" height="62" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="34" y="94" font-weight="bold" fill="#1e40af">Original harness</text>
  <text x="34" y="116">same agent, same model, 3 runs</text>

  <rect x="20" y="150" width="290" height="62" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="34" y="174" font-weight="bold" fill="#9a3412">Harbor port</text>
  <text x="34" y="196">same agent, same model, 3 runs</text>

  <line x1="165" y1="212" x2="165" y2="246" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="160,244 170,244 165,254" fill="#6b7280"/>
  <rect x="20" y="258" width="290" height="92" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="34" y="282" font-weight="bold">The matching criterion</text>
  <text x="34" y="304">Do the two ranges of run scores overlap?</text>
  <text x="34" y="324">yes: the port passes</text>
  <text x="34" y="342">no: treat as an adaptation error</text>

  <text x="20" y="392" font-size="13" fill="#4b5563">Source: Harbor contributor guide, Step 5,</text>
  <text x="20" y="410" font-size="13" fill="#4b5563">"the two sides match if and only if their</text>
  <text x="20" y="428" font-size="13" fill="#4b5563">run-score ranges overlap".</text>

  <!-- right: two real records -->
  <text x="350" y="76" font-weight="bold">USACO, resolved rate (%)</text>
  <!-- axis 38..48 -> x 380..920 -->
  <line x1="380" y1="196" x2="920" y2="196" stroke="#9ca3af" stroke-width="1"/>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="380" y="214">38</text><text x="488" y="214">40</text><text x="596" y="214">42</text>
    <text x="704" y="214">44</text><text x="812" y="214">46</text><text x="920" y="214">48</text>
  </g>
  <!-- original range 39.5..41.0 -->
  <line x1="461" y1="110" x2="542" y2="110" stroke="#2563eb" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <circle cx="461" cy="110" r="5" fill="#2563eb"/><circle cx="515" cy="110" r="5" fill="#2563eb"/><circle cx="542" cy="110" r="5" fill="#2563eb"/>
  <text x="455" y="96" font-size="12" fill="#1e40af" text-anchor="end">original 39.5, 40.5, 41.0</text>
  <!-- harbor range 41.1..45.7 -->
  <line x1="547" y1="150" x2="796" y2="150" stroke="#d97706" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <circle cx="547" cy="150" r="5" fill="#d97706"/><circle cx="601" cy="150" r="5" fill="#d97706"/><circle cx="796" cy="150" r="5" fill="#d97706"/>
  <text x="804" y="155" font-size="12" fill="#9a3412">port 41.1, 42.1, 45.7</text>
  <!-- gap marker -->
  <line x1="542" y1="118" x2="542" y2="142" stroke="#374151" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="547" y1="118" x2="547" y2="142" stroke="#374151" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="560" y="182" font-size="13" font-weight="bold" fill="#b91c1c">Ranges miss by 0.1: FAIL.</text>
  <text x="730" y="182" font-size="13">Gap between means: 2.6 points.</text>

  <text x="350" y="262" font-weight="bold">RexBench, final success rate (%)</text>
  <!-- axis 10..60 -> x 380..920 -->
  <line x1="380" y1="382" x2="920" y2="382" stroke="#9ca3af" stroke-width="1"/>
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="380" y="400">10</text><text x="488" y="400">20</text><text x="596" y="400">30</text>
    <text x="704" y="400">40</text><text x="812" y="400">50</text><text x="920" y="400">60</text>
  </g>
  <!-- original: 33.33 three times -->
  <circle cx="632" cy="296" r="5" fill="#2563eb"/>
  <text x="644" y="300" font-size="12" fill="#1e40af">original 33.33 in all three runs</text>
  <!-- harbor range 16.67..58.33 -->
  <line x1="452" y1="336" x2="902" y2="336" stroke="#d97706" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <circle cx="452" cy="336" r="5" fill="#d97706"/><circle cx="812" cy="336" r="5" fill="#d97706"/><circle cx="902" cy="336" r="5" fill="#d97706"/>
  <text x="452" y="358" font-size="12" fill="#9a3412">port 16.67, 50.0, 58.33</text>
  <text x="560" y="428" font-size="13" font-weight="bold" fill="#15803d">Ranges overlap: PASS.</text>
  <text x="730" y="428" font-size="13">Gap between means: 8.3 points.</text>

  <text x="350" y="458" font-size="13" fill="#374151">Same rule, opposite verdicts. The rejected comparison is the one whose runs say more about closeness.</text>
</svg>
